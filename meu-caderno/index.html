<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 1. NOME QUE APARECE EM CIMA DA GUIA DO NAVEGADOR -->
    <title>Meu Caderno Digital</title>

    <!-- 2. DESCRIÇÃO GERAL DO SITE -->
    <meta name="description" content="Seu caderno de estudos inteligente para organizar cursos, matérias e aulas." />

    <!-- 3. MENSAGEM E FOTO PARA QUANDO COMPARTILHAR O LINK (WhatsApp, Telegram, Instagram, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Meu Caderno de Aulas 📚" />
    <meta property="og:description" content="Acesse minhas anotações, cursos e resumos de estudo de forma organizada!" />
    <!-- Coloque uma foto na pasta 'public' (ex: og-image.png) com tamanho ideal de 1200x630 -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://seusite.vercel.app" />

    <!-- Tags extras para Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Meu Caderno de Aulas 📚" />
    <meta name="twitter:description" content="Acesse minhas anotações, cursos e resumos de estudo de forma organizada!" />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
